<script>
(()=>{
  // Continuous review rotation. It stops while the visitor touches, holds, hovers, wheels or focuses the row, and resumes as soon as they let go.
  const track=document.getElementById('review-track');
  const motion=matchMedia('(prefers-reduced-motion:reduce)');
  const originals=[...track.querySelectorAll('.quote')];
  const copies=originals.map(card=>{const c=card.cloneNode(true);c.setAttribute('aria-hidden','true');c.tabIndex=-1;track.append(c);return c});
  let held=false,hovered=false,focused=false,visible=true,settleUntil=0,previous=0,fraction=0,period=0;
  const measure=()=>{period=copies[0].offsetLeft-originals[0].offsetLeft};
  const wrap=()=>{if(period<=0)return;if(track.scrollLeft>=period)track.scrollLeft-=period;else if(track.scrollLeft<=0&&(held||performance.now()<settleUntil))track.scrollLeft+=period};
  const settle=ms=>{settleUntil=performance.now()+ms};
  const tick=time=>{
    const run=!held&&!hovered&&!focused&&visible&&!motion.matches&&!document.hidden&&period>0&&time>=settleUntil;
    if(run&&previous){fraction+=Math.min(time-previous,64)*36/1000;const px=Math.floor(fraction);fraction-=px;if(px){track.scrollLeft+=px;wrap()}}
    else if(!run)fraction=0;
    previous=time;requestAnimationFrame(tick);
  };
  track.addEventListener('pointerdown',()=>{held=true},{passive:true});
  ['pointerup','pointercancel'].forEach(e=>addEventListener(e,()=>{if(held){held=false;settle(350)}},{passive:true}));
  track.addEventListener('touchstart',()=>{held=true},{passive:true});
  ['touchend','touchcancel'].forEach(e=>track.addEventListener(e,()=>{held=false;settle(350)},{passive:true}));
  // a swipe keeps gliding after release: wait for it to finish, then carry on
  track.addEventListener('scroll',()=>{if(held||performance.now()<settleUntil){settle(250);wrap()}},{passive:true});
  track.addEventListener('wheel',()=>settle(500),{passive:true});
  track.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hovered=true});
  track.addEventListener('pointerleave',()=>{hovered=false});
  track.addEventListener('focusin',()=>{focused=track.matches(':focus-visible')||!!track.querySelector(':focus-visible')});
  track.addEventListener('focusout',()=>queueMicrotask(()=>{focused=track.contains(document.activeElement)}));
  track.addEventListener('keydown',e=>{if(e.target!==track)return;const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();if(d<0&&track.scrollLeft<period/originals.length)track.scrollLeft+=period;track.scrollBy({left:d*(originals[0].offsetWidth+22),behavior:motion.matches?'instant':'smooth'})});
  addEventListener('resize',measure,{passive:true});
  if('ResizeObserver' in window)new ResizeObserver(measure).observe(track);
  if('IntersectionObserver' in window)new IntersectionObserver(es=>{visible=es[0].isIntersecting}).observe(track);
  measure();requestAnimationFrame(tick);
})();
</script>
